<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Panel - Add Wholesale Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="/" class="logo-area">
        <div class="logo-badge">meesho</div>
        <div class="logo-text">Supplier Hub</div>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">🛒 Shop & Resell</a>
        <a href="reseller.html" class="nav-link">💼 My Reseller Dashboard</a>
        <a href="supplier.html" class="nav-link active">🏭 Supplier Portal</a>
        <a href="admin.html" class="nav-link">⚙️ Admin</a>
      </nav>
    </div>
  </header>

  <main class="main-container" style="max-width: 800px;">
    <h2 style="margin-bottom: 20px;">🏭 Add Wholesale Products to Reseller Network</h2>

    <div style="background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--card-border);">
      <form onsubmit="handleAddProduct(event)">
        <div class="form-group">
          <label>Product Title / Name</label>
          <input type="text" id="p-title" class="form-control" placeholder="e.g. Designer Georgette Saree" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label>Category</label>
            <select id="p-category" class="form-control">
              <option>Sarees</option>
              <option>Kurtis</option>
              <option>Men Wear</option>
              <option>Electronics</option>
              <option>Jewellery</option>
            </select>
          </div>
          <div class="form-group">
            <label>Supplier / Company Name</label>
            <input type="text" id="p-supplier" class="form-control" placeholder="e.g. Surat Wholesale Traders" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label>Wholesale Rate (₹)</label>
            <input type="number" id="p-wholesale" class="form-control" placeholder="350" required>
          </div>
          <div class="form-group">
            <label>Suggested Selling Price (₹)</label>
            <input type="number" id="p-suggested" class="form-control" placeholder="599" required>
          </div>
          <div class="form-group">
            <label>MRP (₹)</label>
            <input type="number" id="p-mrp" class="form-control" placeholder="1299" required>
          </div>
        </div>

        <div class="form-group">
          <label>Image URL</label>
          <input type="url" id="p-image" class="form-control" placeholder="https://images.unsplash.com/..." required>
        </div>

        <div class="form-group">
          <label>Product Description & Specs</label>
          <textarea id="p-desc" class="form-control" rows="3" placeholder="Fabric, Size options, Care instructions..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="padding: 12px; font-size: 15px;">
          🚀 List Product for 100,000+ Resellers
        </button>
      </form>
    </div>
  </main>

  <script>
    async function handleAddProduct(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('p-title').value,
        category: document.getElementById('p-category').value,
        supplierName: document.getElementById('p-supplier').value,
        wholesalePrice: document.getElementById('p-wholesale').value,
        suggestedSellingPrice: document.getElementById('p-suggested').value,
        mrp: document.getElementById('p-mrp').value,
        image: document.getElementById('p-image').value,
        description: document.getElementById('p-desc').value
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ Product successfully added to Meesho catalog!');
          window.location.href = '/';
        }
      } catch (err) {
        alert('Failed to add product.');
      }
    }
  </script>
</body>
</html>
